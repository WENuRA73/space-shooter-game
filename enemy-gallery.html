<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enemy Fleet Gallery (Development)</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; font: 16px Arial, sans-serif; color: #dceeff; background: #071026; }
    main { max-width: 900px; margin: auto; }
    h1 { color: #62e5ff; }
    .note { padding: 12px 16px; border: 1px solid #4b9cb3; background: #102e46; }
    select { padding: 10px; font: inherit; background: #172b48; color: white; border: 1px solid #62e5ff; }
    .preview { display: grid; place-items: center; min-height: 410px; margin: 18px 0; border: 1px solid #3a6d86;
      background-color: #172339; background-image: linear-gradient(45deg,#26344d 25%,transparent 25%),
      linear-gradient(-45deg,#26344d 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#26344d 75%),
      linear-gradient(-45deg,transparent 75%,#26344d 75%); background-size: 30px 30px; }
    img { max-width: 90%; max-height: 390px; object-fit: contain; transform: rotate(180deg); }
    dl { display: grid; grid-template-columns: 170px 1fr; gap: 8px; }
    dt { color: #8ccfe9; } dd { margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Enemy Fleet Gallery</h1>
    <p class="note">All ten PNGs are shown at their original proportions, rotated 180° as in gameplay so their noses face the player. Some source cutouts still show fragments from adjacent poster cells.</p>
    <label for="ship">Ship:</label> <select id="ship"></select>
    <p><a id="try" href="/" style="color:#62e5ff">Try this enemy in the game</a></p>
    <div class="preview"><img id="art" alt="Selected enemy ship" /></div>
    <dl id="details"></dl>
  </main>
  <script type="module" src="/src/enemyGallery.js"></script>
</body>
</html>
